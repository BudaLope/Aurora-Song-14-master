- type: entity
  parent: PillCanister
  id: NFPillCanisterMannitol
  suffix: Mannitol 10u, 10, Clarpy
  description: Take two pills daily.
  components:
  - type: Label
    currentLabel: medicine-label-mannitol-clarpy
  - type: EntityTableContainerFill # Aurora's Song - StorageFill>EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: NFPillMannitol
          amount: 10

- type: entity
  name: pill
  suffix: Mannitol 10u
  parent: Pill
  id: NFPillMannitol
  components:
  - type: Pill
    pillType: 13
  - type: Sprite
    state: pill14
  - type: Label
    currentLabel: mannitol 10u
  - type: Solution # Aurora's Song - Convert to solution
    solution:
      reagents:
      - ReagentId: Mannitol
        Quantity: 10

- type: entity
  name: pill
  suffix: Sheleg emergency pill
  parent: Pill
  id: NFPillSheleg
  description: A safe way to stabilize Sheleg patients in critical condition for personnel without advanced medical knowledge.
  components:
  - type: Pill
    pillType: 9
  - type: Sprite
    state: pill10
  - type: Label
    currentLabel: sheleg emergency pill
  - type: Solution # Aurora's Song - Convert to solution
    solution:
      reagents:
      - ReagentId: Cryoxadone
        Quantity: 3
      - ReagentId: Stellibinin
        Quantity: 2
      - ReagentId: Traumoxadone
        Quantity: 1
      - ReagentId: Aloxadone
        Quantity: 1

