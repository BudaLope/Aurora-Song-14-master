# region base
- type: entity
  abstract: true
  parent: ClothingNeckBase
  id: NFBaseClothingNeckHolster
  components:
  - type: Item
    size: Normal
  - type: Sprite
  - type: Clothing
  - type: ItemSlots
    slots:
      weapon:
        priority: 4
        name: clothing-neck-sidearm
        whitelist:
          tags:
          - Sidearm
        ejectSound: #Aurora's Song - add unique holster sounds; originally made for Den
          path: /Audio/_DEN/Weapons/pistol_unholster.ogg
        insertSound: #Aurora's Song - add unique holster sounds; originally made for Den
          path: /Audio/_DEN/Weapons/pistol_holster.ogg
      magazine:
        priority: 3
        name: clothing-neck-magazine
        whitelist:
          tags:
          - NFMagazinePistol35
          - NFMagazinePistol45
          - NFMagazineHighCapacityPistol35
          - NFSpeedLoaderPistol35
          - NFSpeedLoaderPistol45
          - SpeedLoaderRifleHeavy
          - ASMagazinePistol40 # Aurora's Song - Allow .40 mags to fit
          - ASMagazineHighCapacityPistol40 # Aurora's Song - Allow High cap .40 mags to fit
          - ASSpeedLoaderPistol40 # Aurora's Song - Allow .40 speedloaders to fit
          - ASMagazinePistolCaselessRifle # Aurora's Song - Allow Cobra mags to fit
          - PowerCellHyper # Aurora's Song - Allow power cells to fit
          - PowerCellHigh # Aurora's Song - Allow power cells to fit
          - PowerCellMedium # Aurora's Song - Allow power cells to fit
          - PowerCellSmall # Aurora's Song - Allow power cells to fit
          - MagazineBRDIP15 # Auroa's Song - Allow BRDI mags to fit
  - type: Appearance
  - type: ItemMapper
    mapLayers:
      icon-gun:
        whitelist:
          tags:
          - Sidearm
      icon-magazine:
        whitelist:
          tags:
          - NFMagazinePistol35
          - NFMagazinePistol45
          - NFMagazineHighCapacityPistol35
          - NFSpeedLoaderPistol35
          - NFSpeedLoaderPistol45
          - SpeedLoaderRifleHeavy
          - ASMagazinePistol40 # Aurora's Song - Allow .40 mags to fit
          - ASMagazineHighCapacityPistol40 # Aurora's Song - Allow High cap .40 mags to fit
          - ASSpeedLoaderPistol40 # Aurora's Song - Allow .40 speedloaders to fit
          - ASMagazinePistolCaselessRifle # Aurora's Song - Allow Cobra mags to fit
          - PowerCellHyper # Aurora's Song - Allow power cells to fit
          - PowerCellHigh # Aurora's Song - Allow power cells to fit
          - PowerCellMedium # Aurora's Song - Allow power cells to fit
          - PowerCellSmall # Aurora's Song - Allow power cells to fit
          - MagazineBRDIP15 # Auroa's Song - Allow BRDI mags to fit
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: []
      weapon: !type:ContainerSlot {}
      magazine: !type:ContainerSlot {}

- type: entity
  abstract: true
  parent: ClothingNeckBase
  id: NFBaseClothingNeckSheath
  components:
  - type: Item
    size: Normal
  - type: Sprite
  - type: Clothing
  - type: ItemSlots
    slots:
      weapon:
        priority: 4
        name: clothing-neck-dagger
        whitelist:
          tags:
          - Knife
          - Baton # Aurora's Song
  - type: Appearance
  - type: ItemMapper
    mapLayers:
      icon-dagger:
        whitelist:
          tags:
          - Knife
          - Baton # Aurora's Song
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: []
      weapon: !type:ContainerSlot {}

# region thigh holster
- type: entity
  parent: NFBaseClothingNeckHolster
  id: NFBaseClothingNeckHolsterThigh
  name: drop leg holster
  description: A holster designed to be strapped to the thigh for easy access to a sidearm. Provides additional pouch for a magazine.
  components:
  - type: Sprite
    sprite: _NF/Clothing/Neck/Misc/holster_thigh.rsi
    layers:
    - state: icon
      color: "#515151"
  - type: Clothing
    sprite: _NF/Clothing/Neck/Misc/holster_thigh.rsi
    clothingVisuals:
      neck:
      - state: equipped-NECK
        color: "#515151"
      neckalt: # Aurora's Song - second neck slot
      - state: equipped-NECK
        color: "#515151"
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
        color: "#515151"
      right:
      - state: inhand-right
        color: "#515151"
  - type: ItemMapper
    sprite: _NF/Clothing/Neck/Misc/holster_thigh.rsi

- type: entity
  parent: [ BaseC2ContrabandUnredeemable, NFBaseClothingNeckHolsterThigh ]
  id: NFBaseClothingNeckHolsterThighNfsd
  name: nfsd drop leg holster
  components:
  - type: Sprite
    layers:
    - state: icon
      color: "#493926"
  - type: Clothing
    clothingVisuals:
      neck:
      - state: equipped-NECK
        color: "#493926"
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
        color: "#493926"
      right:
      - state: inhand-right
        color: "#493926"

