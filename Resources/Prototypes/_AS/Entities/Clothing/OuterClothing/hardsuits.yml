#region SLE Hardsuits
- type: entity
  parent: ASClothingOuterHardsuitBaseSle
  id: ClothingOuterHardsuitSleCombat
  name: SLE combat suit
  description: A heavily armored SLE suit. Space proof, with thick armor plating at the expense of mobility.
  components:
  - type: Sprite
    sprite: _AS/Clothing/OuterClothing/Hardsuits/sle_combat.rsi
  - type: Clothing
    sprite: _AS/Clothing/OuterClothing/Hardsuits/sle_combat.rsi
  - type: ToggleableClothing
    clothingPrototype: ClothingHeadHelmetHardsuitSleCombat
  - type: ExplosionResistance
    damageCoefficient: 0.2 # .4 > .2 Very hard to explode
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.6 # .5 > .6 Easier to beat
        Slash: 0.6
        Piercing: 0.45 # .55 > .45 Harder to shoot, 5% diff on most merc suits
        Heat: 0.4 # .6 > .4 Harder to burn
        Radiation: 0.4 # .5 > .4 Harder to irradiate
        Caustic: 0.4 # .7 > .4 Harder to super burn
  - type: ClothingSpeedModifier
    walkModifier: 0.9 # .85 > .9 Better movement
    sprintModifier: 0.9 # .85 > .9 Better movement
  - type: StaminaResistance # Stun resist, inline with bloodred values here
    damageCoefficient: 0.75

