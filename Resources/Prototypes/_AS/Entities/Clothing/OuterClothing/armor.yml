#region SLE

- type: entity
  parent: [ ClothingOuterBaseLarge, BaseC2ContrabandUnredeemable ]
  id: ASClothingOuterArmorSLE
  name: SLE Durathread Vest
  description: Standard issue armor for Sector Law Enforcement personnel.
  components:
  - type: Sprite
    sprite: _AS/Clothing/OuterClothing/Armor/sle_armor.rsi # Aurora Song - Using SLE-recolored sprites
  - type: Clothing
    sprite: _AS/Clothing/OuterClothing/Armor/sle_armor.rsi # Aurora Song - Using SLE-recolored sprites
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.4 # .7 > .4 more in line with a stab vest
        Slash: 0.4 # .7 > .4 more in line with a stab vest
        Piercing: 0.75 # .65 > .75 more in line with a stab vest
        Heat: 0.7
        Caustic: 0.65
  - type: ClothingSpeedModifier
    walkModifier: 1.05 # 1.0 > 1.05 More mobile as a counter choice
    sprintModifier: 1.05 # 1.0 > 1.05 More mobile as a counter choice
  - type: ExplosionResistance
    damageCoefficient: 0.80 # .6 > .8 more in line with a stab vest
  - type: StaminaResistance # Stun resist, inline with bloodred values here
    damageCoefficient: 0.75
  - type: GroupExamine

