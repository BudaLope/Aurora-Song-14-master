- type: entity
  parent: [BaseStructureIndestructible, BaseComputerAiAccess] # Frontier: added BaseStructureIndestructible
  id: ComputerLicenseConsole
  name: License computer
  description: Terminal for printing licenses.
  components:
  - type: LicenseConsole
    holderIdSlot:
      ejectSound: /Audio/Machines/id_swipe.ogg
      insertSound: /Audio/Machines/id_insert.ogg
      whitelist:
        components:
        - IdCard
    licenseName: LicenseContrabandHandling
  - type: AccessReader
    access: [["Lieutenant"], ["HeadOfSecurity"]] # Aurora's Song - changed from Bailiff to Lieutenant
  - type: ActivatableUIRequiresAccess
  - type: ActivatableUI
    key: enum.LicenseConsoleUiKey.Key
  - type: UserInterface
    interfaces:
      enum.LicenseConsoleUiKey.Key:
        type: LicenseConsoleBoundUserInterface
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: Speech
    speechVerb: Robotic
    speechSounds: Pai
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: id
    - map: ["computerLayerKeys"]
      state: id_key
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open
  - type: Computer
    board: LicenseComputerCircuitboard
  - type: PointLight
    radius: 1.5
    energy: 1.6
    color: "#3c5eb5"
  - type: Tag
    tags:
    - AccessBreakerImmune
  - type: ItemSlots
  - type: ContainerContainer
    containers:
      board: !type:Container
      LicenseConsole-holderId: !type:ContainerSlot

- type: entity
  parent: [BaseStructureIndestructible, BaseComputerAiAccess] # Frontier: added BaseStructureIndestructible
  id: ComputerScuOutput
  name: SCU Output Terminal
  description: Terminal for receiving SCUs for contraband turn-ins.
  components:
  - type: ScuOutput
  - type: Speech
    speechVerb: Robotic
    speechSounds: Pai
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: id
    - map: ["computerLayerKeys"]
      state: id_key
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open
  - type: Computer
  - type: PointLight
    radius: 1.5
    energy: 1.6
    color: "#3c5eb5"
  - type: ContainerContainer
    containers:
      board: !type:Container
  - type: ToggleEvent
    active: false

- type: entity
  parent: ComputerShuttle
  id: ComputerShuttleSLE
  name: SLE shuttle console
  description: A shuttle console with a long-range mass scanner, custom made for the SLE
  components:
  - type: Sprite
    layers:
    - map: [ "computerLayerBody" ]
      state: computer
    - map: [ "computerLayerKeyboard" ]
      state: generic_keyboard
    - map: [ "computerLayerScreen" ]
      state: sleshuttle
    - map: [ "computerLayerKeys" ]
      state: generic_keys
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open
  #- type: Tag
  #  tags:
  #I'm sure the SLE has a tag, I don't know what it is
  - type: RadarConsole
    maxRange: 768
  - type: Computer
    board: SLEShuttleConsoleCircuitboard
