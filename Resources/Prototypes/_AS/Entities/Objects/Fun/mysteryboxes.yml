- type: entity
  parent: MysteryFigureBox
  id: MysteryWehBox
  name: mystery weh friend box
  description: A box containing a plush toy resembling a lizard. The box art claims that your new best friend is just a box "a-weh"!
  components:
  - type: Sprite
    sprite: _AS/Objects/Fun/wehfren.rsi
    scale: 0.65, 0.65
    layers:
      - state: wehfren-box
  - type: StaticPrice
    price: 160
  - type: SpawnEntityTableOnTrigger
    useMapCoords: true
    table: !type:AllSelector
      children:
      - id: WehFrenBoxTrash
      - !type:NestedSelector
        tableId: AllLizardPlushieGambaTable

- type: entity
  parent: MysteryFigureBox
  id: MysteryWehBoxCommand
  name: mystery limited-edition weh friend box
  description: A box containing a plush toy resembling a lizard. The box art claims that your new best friend is just a box "a-weh"! This one is extra-fancy!
  components:
  - type: Sprite
    sprite: _AS/Objects/Fun/wehfren.rsi
    scale: 0.65, 0.65
    layers:
      - state: wehfren-box-gold
  - type: StaticPrice
    price: 320
  - type: SpawnEntityTableOnTrigger
    useMapCoords: true
    table: !type:AllSelector
      children:
      - id: WehFrenBoxGoldTrash
      - !type:NestedSelector
        tableId: RareLizardPlushieGambaTable

- type: entity
  parent: MysteryFigureBoxTrash
  id: WehFrenBoxTrash
  components:
  - type: Sprite
    sprite: _AS/Objects/Fun/wehfren.rsi
    state: wehfren-box-unfolded

- type: entity
  parent: MysteryFigureBoxTrash
  id: WehFrenBoxGoldTrash
  components:
  - type: Sprite
    sprite: _AS/Objects/Fun/wehfren.rsi
    state: wehfren-box-gold-unfolded

