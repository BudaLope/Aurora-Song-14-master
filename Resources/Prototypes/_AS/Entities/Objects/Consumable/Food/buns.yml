# Base
- type: entity
  parent: [SolutionTiny, FoodInjectableBase]
  id: FoodBunBase
  abstract: true
  components:
  - type: Sprite
    sprite: _AS/Objects/Consumable/Food/buns.rsi
  - type: Edible
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 30
      - ReagentId: Flavorol
        Quantity: 10
  - type: Item
    size: Small
    shape:
    - 0,0,1,0
    storedOffset: 0, -5
  - type: FlavorProfile
    flavors:
      - bread
  - type: Tag
    tags:
    - Bread

# Buns
- type: entity
  parent: FoodBunBase
  id: FoodBunSteamedMeat # cha siu, kinda.
  suffix: Meat
  name: steamed bun
  description: A steamed bun. This one smells savory.
  components:
  - type: Sprite
    state: steamed
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 30
      - ReagentId: Flavorol
        Quantity: 10
      - ReagentId: Protein
        Quantity: 10
  - type: FlavorProfile
    flavors:
      - bread
      - meaty
      - sweet
      - smokey
  - type: Tag
    tags:
    - Meat

- type: entity
  parent: FoodBunSteamedMeat
  id: FoodBunBakedMeat
  name: baked bun
  description: A baked bun, sprinkled with sesame seeds. This one smells savory.
  components:
  - type: Sprite
    state: baked

